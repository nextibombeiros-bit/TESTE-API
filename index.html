<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API Nexti - Marcações Fora da Unidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .map { height: 250px; width: 100%; border: 1px solid #ddd; }
        .photo { max-width: 150px; max-height: 150px; border: 1px solid #ccc; }
        .status-NORMAL { background-color: #d4edda; }
        .status-ATENCAO_FORA_PERIMETRO { background-color: #fff3cd; }
        .status-FORA_DA_UNIDADE { background-color: #f8d7da; }
        .status-CRITICO_FORA_DA_UNIDADE { background-color: #f5c6cb; }
        .status-SEM_LOCALIZACAO { background-color: #e2e3e5; }
        .status-POSTO_SEM_COORDENADA { background-color: #d1ecf1; }
        .table th, .table td { vertical-align: middle; }
    </style>
</head>
<body class="bg-light">
    <div class="container my-4">
        <header class="text-center mb-4">
            <h1 class="display-4">Teste API Nexti</h1>
            <p class="lead">Monitoramento de Marcações de Ponto Fora da Unidade para Bombeiros</p>
        </header>

        <div id="summary" class="alert alert-info">
            Carregando dados...
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered" id="alerts-table">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Unidade</th>
                        <th>Data/Hora</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Distância</th>
                        <th>Localização</th>
                        <th>Foto</th>
                        <th>Dispositivo</th>
                        <th>Motivo</th>
                    </tr>
                </thead>
                <tbody id="alerts-body"></tbody>
            </table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function loadData() {
            try {
                const response = await fetch('output/alertas_fora_unidade.json');
                const alerts = await response.json();
                displaySummary(alerts);
                displayAlerts(alerts);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('summary').innerHTML = '<div class="alert alert-danger">Erro ao carregar dados. Execute o script primeiro ou verifique os arquivos.</div>';
            }
        }

        function displaySummary(alerts) {
            const total = alerts.length;
            const semLocalizacao = alerts.filter(a => a.status === 'SEM_LOCALIZACAO').length;
            const comFoto = alerts.filter(a => a.photoPath).length;
            const semFoto = total - comFoto;
            const summary = `
                <strong>Total de alertas:</strong> ${total} |
                <strong>Sem localização:</strong> ${semLocalizacao} |
                <strong>Com foto:</strong> ${comFoto} |
                <strong>Sem foto:</strong> ${semFoto}
            `;
            document.getElementById('summary').innerHTML = summary;
        }

        function displayAlerts(alerts) {
            const tbody = document.getElementById('alerts-body');
            alerts.forEach(alert => {
                const row = document.createElement('tr');
                row.className = `status-${alert.status}`;
                row.innerHTML = `
                    <td>${alert.personName}</td>
                    <td>${alert.nameCareer}</td>
                    <td>${alert.workplaceName}</td>
                    <td>${new Date(alert.clockingDate).toLocaleString('pt-BR')}</td>
                    <td>${alert.clockingTypeName}</td>
                    <td><span class="badge bg-secondary">${alert.status}</span></td>
                    <td>${alert.distanceMeters ? alert.distanceMeters.toFixed(2) + 'm' : 'N/A'}</td>
                    <td>${createMap(alert)}</td>
                    <td>${alert.photoPath ? `<img src="${alert.photoPath}" class="photo img-fluid" alt="Foto da marcação">` : '<em>Sem foto</em>'}</td>
                    <td>${alert.deviceDescription}</td>
                    <td>${alert.reason}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function createMap(alert) {
            if (!alert.clockingLatitude || !alert.clockingLongitude) {
                return '<em>Sem coordenadas</em>';
            }
            const mapId = `map-${alert.personId}-${Date.now()}-${Math.random()}`;
            const mapHtml = `<div id="${mapId}" class="map"></div>`;
            setTimeout(() => {
                const map = L.map(mapId).setView([alert.clockingLatitude, alert.clockingLongitude], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                L.marker([alert.clockingLatitude, alert.clockingLongitude]).addTo(map)
                    .bindPopup('Marcação de ' + alert.personName);
                if (alert.workplaceLatitude && alert.workplaceLongitude) {
                    L.marker([alert.workplaceLatitude, alert.workplaceLongitude]).addTo(map)
                        .bindPopup('Unidade: ' + alert.workplaceName);
                }
            }, 200);
            return mapHtml;
        }

        loadData();
    </script>
</body>
</html>
